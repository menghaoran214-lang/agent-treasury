<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc">
  <title id="title">Agent Treasury purchase flow</title><desc id="desc">A chat request becomes vendor evaluation, policy decision, optional approval, wallet payment, delivery verification, and an accounting record.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07101a"/><stop offset="1" stop-color="#101c27"/></linearGradient><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0l9 4.5L0 9z" fill="#f5b800"/></marker><style>.h{font:700 17px system-ui,sans-serif;fill:#f4f7fb}.p{font:400 12px system-ui,sans-serif;fill:#94a1af}.n{font:800 13px system-ui,sans-serif;fill:#081018}.b{fill:#101b26;stroke:#2a3948}.g{fill:#f5b800}.l{fill:none;stroke:#f5b800;stroke-width:2;marker-end:url(#a)}.t{font:700 27px system-ui,sans-serif;fill:#f4f7fb}.s{font:400 14px system-ui,sans-serif;fill:#94a1af}</style></defs>
  <rect width="1200" height="410" rx="22" fill="url(#bg)"/><text x="42" y="52" class="t">From a sentence to an auditable purchase</text><text x="42" y="78" class="s">Treasury appears only when policy or an exception requires attention.</text>
  <g transform="translate(35 120)"><rect class="b" width="150" height="112" rx="13"/><circle class="g" cx="25" cy="25" r="15"/><text class="n" x="21" y="30">1</text><text class="h" x="20" y="65">Ask naturally</text><text class="p" x="20" y="89">Describe the paid</text><text class="p" x="20" y="106">resource you need</text></g><path class="l" d="M185 176h28"/>
  <g transform="translate(220 120)"><rect class="b" width="150" height="112" rx="13"/><circle class="g" cx="25" cy="25" r="15"/><text class="n" x="21" y="30">2</text><text class="h" x="20" y="65">Compare</text><text class="p" x="20" y="89">Vendor, price,</text><text class="p" x="20" y="106">quality and risk</text></g><path class="l" d="M370 176h28"/>
  <g transform="translate(405 120)"><rect class="b" width="150" height="112" rx="13"/><circle class="g" cx="25" cy="25" r="15"/><text class="n" x="21" y="30">3</text><text class="h" x="20" y="65">Apply policy</text><text class="p" x="20" y="89">Auto · approval</text><text class="p" x="20" y="106">· hard block</text></g><path class="l" d="M555 176h28"/>
  <g transform="translate(590 120)"><rect class="b" width="150" height="112" rx="13"/><circle class="g" cx="25" cy="25" r="15"/><text class="n" x="21" y="30">4</text><text class="h" x="20" y="65">Wallet pays</text><text class="p" x="20" y="89">Chosen verified</text><text class="p" x="20" y="106">chain + token route</text></g><path class="l" d="M740 176h28"/>
  <g transform="translate(775 120)"><rect class="b" width="150" height="112" rx="13"/><circle class="g" cx="25" cy="25" r="15"/><text class="n" x="21" y="30">5</text><text class="h" x="20" y="65">Verify delivery</text><text class="p" x="20" y="89">Payment and result</text><text class="p" x="20" y="106">tracked separately</text></g><path class="l" d="M925 176h28"/>
  <g transform="translate(960 120)"><rect class="b" width="205" height="112" rx="13"/><circle class="g" cx="25" cy="25" r="15"/><text class="n" x="21" y="30">6</text><text class="h" x="20" y="65">Receipt + ledger</text><text class="p" x="20" y="89">Reason, evidence and</text><text class="p" x="20" y="106">editable accounting</text></g>
  <rect x="35" y="285" width="1130" height="76" rx="12" fill="#0c1720" stroke="#394756"/><text class="h" x="58" y="315">Notification behavior</text><text class="p" x="58" y="340">Detailed: show the process · Concise: show the result · Silent: interrupt only for approval or exceptions</text>
</svg>
